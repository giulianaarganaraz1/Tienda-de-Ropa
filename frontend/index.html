<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Giuliana Studio</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
<header>
    <div class="logo">
        <h1>Giuliana Studio</h1>
    </div>

    <div class="buscador">
        <input type="text" placeholder="Buscar productos">
    </div>

    <div class="button">
        <button>♡</button>
        <button>🛒</button>
    </div>
</header>    

<main>

    <section class="hero">

        <h2>Nueva Colección</h2>

        <p>
            Ropa personalizada diseñada para expresar tu estilo.
        </p>

        <button class="btn-principal">
            Ver colección
        </button>

    </section>
    

    <section class="productos">

    <h2>Productos Destacados</h2>

    <div class="grid-productos">

        <!-- Producto 1 -->
        <div class="card">

            <img src="images/remera.jpg" alt="Remera">

            <h3>Remera Oversize</h3>

            <p>$25.000</p>

            <button>Ver producto</button>

        </div>

        <!-- Producto 2 -->
        <div class="card">

            <img src="images/buzo.jpg" alt="Buzo">

            <h3>Buzo Negro</h3>

            <p>$40.000</p>

            <button>Ver producto</button>

        </div>

        <!-- Producto 3 -->
        <div class="card">

            <img src="images/pollera.jpg" alt="Pollera">

            <h3>Pollera Denim</h3>

            <p>$35.000</p>

            <button>Ver producto</button>

        </div>

    </div>

</section>

</main>


</body>



</html>
